name: Scheduled release - autonomy-is-a-harness-property

# One-shot scheduled release for the "Autonomy Is a Harness Property" post.
# Squash-merges post/autonomy-is-a-harness-property into master at the
# configured time, then deletes itself so it cannot fire again.
#
# Hugo deploy is triggered by the resulting push to master (see hugo.yml).

on:
  schedule:
    # 14:00 UTC = 07:00 America/Vancouver on 2026-05-27 (PDT, UTC-7).
    # Cron runs every day at 14:00 UTC; the date gate below ensures it
    # only acts on the intended day.
    - cron: '0 14 * * *'
  workflow_dispatch:
    # Manual override for testing or early release.
    inputs:
      force:
        description: 'Bypass the date gate and run immediately'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: scheduled-release-autonomy-harness
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Date gate
        id: gate
        run: |
          set -euo pipefail
          TARGET="2026-05-27"
          TODAY="$(date -u +%Y-%m-%d)"
          FORCE="${{ github.event.inputs.force }}"
          echo "today_utc=$TODAY  target=$TARGET  force=$FORCE"
          if [[ "$TODAY" != "$TARGET" && "$FORCE" != "true" ]]; then
            echo "Not the release date yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout master
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # GITHUB_TOKEN with contents:write can push to master and delete
          # branches in this repo.
          persist-credentials: true

      - name: Configure git identity
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch release branch
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin post/autonomy-is-a-harness-property:post/autonomy-is-a-harness-property

      - name: Squash-merge into master
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git merge --squash post/autonomy-is-a-harness-property
          git commit -m "Add post: Autonomy Is a Harness Property"
          git log --oneline -3

      - name: Push master
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git push origin master

      - name: Delete release branch (remote + local)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git push origin --delete post/autonomy-is-a-harness-property || true
          git branch -D post/autonomy-is-a-harness-property || true

      - name: Self-destruct this workflow
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git rm .github/workflows/scheduled-release-autonomy-harness.yml
          git commit -m "chore: remove one-shot release workflow for autonomy-is-a-harness-property"
          git push origin master
